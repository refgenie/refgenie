name: Publish Python package

# Publishing is gated on a GitHub Release, which is in turn gated on a tag.
# Publishing a release, pre-release or full, uploads that tag's build to PyPI.
# A pre-release version (1.0.0a1) is skipped by `pip install refgenie` unless
# the user asks with --pre or pins it, so an alpha reaches only those who opt in.
#
# The upload uses PyPI Trusted Publishing (OIDC), so no API tokens live in this
# repository. See the "Publishing a release" section of CONTRIBUTING.md for the
# one-time setup on pypi.org; until that is done, the upload job fails.
on:
  release:
    types: [published]

jobs:
  frontend:
    uses: ./.github/workflows/build-frontend.yml

  build:
    name: Build distributions
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download built web UI
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: refgenie/server/webui

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Verify frontend was built before packaging
        run: |
          test -f refgenie/server/webui/index.html || {
            echo "::error::refgenie/server/webui/index.html missing; the frontend was not built before uv build"
            exit 1
          }

      - name: Build refgenie package
        run: uv build

      # Every artifact that reaches PyPI is downstream of this
      # job's `dist` artifact, so this is the one place that has to prove
      # freshness: a wheel/sdist built from anything but this release's exact
      # commit, or from a dirty frontend checkout, fails the release here.
      - name: Check wheel and sdist carry a fresh web UI bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 tests/scripts/check-wheel-assets.py dist/*.whl dist/*.tar.gz --require-fresh

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/refgenie
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish refgenie to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of a release must not fail because the files are already
          # there.
          skip-existing: true
