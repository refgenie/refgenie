name: Install check

# Installs refgenie from PyPI exactly as the docs tell users to, in a clean
# environment, then runs it against the public server. Unit tests use the
# locked dependencies, so they cannot see a release that breaks for a fresh
# install (as when `--pre` pulled a pre-release httpx). Runs after each release.
on:
  workflow_run:
    workflows: ["Publish Python package"]
    types: [completed]
  workflow_dispatch:

env:
  # Keep in step with the install line in README.md and docs/refgenie/install.md.
  INSTALL_SPEC: "refgenie>=1.0.0a1"

jobs:
  install:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install as documented
        run: |
          python -m venv /tmp/rg
          /tmp/rg/bin/pip install --quiet "$INSTALL_SPEC"
          /tmp/rg/bin/pip list | grep -iE "^(refgenie|httpx) "

      - name: Run against the public server
        env:
          REFGENIE_HOME_PATH: /tmp/rg-home
        run: |
          export PATH=/tmp/rg/bin:$PATH
          refgenie --help > /dev/null
          refgenie init
          refgenie pull rCRSd/fasta
          test -s "$(refgenie seek rCRSd/fasta)"
