version: 2

# One bundled PR per month covering every package type.
multi-ecosystem-groups:
  monthly:
    schedule:
      interval: "monthly"
    target-branch: "dev"

updates:
  - package-ecosystem: "pip"
    directory: "/"
    patterns: ["*"]
    ignore:
      # Pinned to 9.16.x; moved by hand in the snakemake 10 upgrade.
      - dependency-name: "snakemake"
    multi-ecosystem-group: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
