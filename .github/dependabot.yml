version: 2

# One bundled PR per month covering every package type.
multi-ecosystem-groups:
  monthly:
    schedule:
      interval: "monthly"
    target-branch: "dev"

updates:
  - package-ecosystem: "pip"
    directory: "/"
    patterns: ["*"]
    # Update uv.lock, but leave pyproject minimums alone unless a new release
    # falls outside them. Raised minimums block installs next to other tools.
    versioning-strategy: increase-if-necessary
    ignore:
      # Allows any 9.x; moved by hand in the snakemake 10 upgrade.
      - dependency-name: "snakemake"
    multi-ecosystem-group: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
